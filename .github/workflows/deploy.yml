name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish, but only
# keep one queued behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Gate the deploy on the same checks used locally.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Contrast
        run: npm run check:contrast

      # Pages serves a project site under /<repo>/, so both builds need that
      # prefix or every asset request 404s.
      - name: Export web app
        run: npx expo export --platform web --output-dir dist
        env:
          PAGES_BASE_URL: /${{ github.event.repository.name }}

      - name: Build Storybook
        run: npm run build-storybook -- -o dist/storybook --quiet
        env:
          STORYBOOK_BASE_URL: /${{ github.event.repository.name }}/storybook/

      # Expo emits assets into _expo/, and Jekyll skips underscore-prefixed
      # directories. Artifact deploys do not run Jekyll, but this costs nothing
      # and saves a confusing outage if the source is ever switched to a branch.
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
